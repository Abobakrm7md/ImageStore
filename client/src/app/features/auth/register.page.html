<section class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <app-icon class="brand-mark" name="logo" [size]="40" />
      <h1>Create your account</h1>
      <p class="muted">Your images stay private to your account.</p>
    </div>

    @if (formError(); as error) {
      <div class="alert alert-error" role="alert">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field">
        <label for="register-email">Email</label>
        <input
          id="register-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          aria-describedby="register-email-error"
        />
        <app-field-error [control]="form.controls.email" label="Email" id="register-email-error" />
      </div>

      <div class="form-field">
        <label for="register-password">Password</label>
        <input
          id="register-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          aria-describedby="register-password-hint register-password-error"
        />
        <p class="hint" id="register-password-hint">
          At least 8 characters, with upper- and lower-case letters and a digit.
        </p>
        <app-field-error
          [control]="form.controls.password"
          label="Password"
          id="register-password-error"
        />
      </div>

      <div class="form-field">
        <label for="register-confirm">Confirm password</label>
        <input
          id="register-confirm"
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          aria-describedby="register-confirm-error"
        />
        <app-field-error
          [control]="form.controls.confirmPassword"
          label="Password confirmation"
          id="register-confirm-error"
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span> Creating account…
        } @else {
          Create account
        }
      </button>
    </form>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
