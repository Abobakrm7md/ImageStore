<section class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <app-icon class="brand-mark" name="logo" [size]="40" />
      <h1>Sign in</h1>
      <p class="muted">Access your private image collection.</p>
    </div>

    @if (formError(); as error) {
      <div class="alert alert-error" role="alert">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="username"
          aria-describedby="login-email-error"
        />
        <app-field-error [control]="form.controls.email" label="Email" id="login-email-error" />
      </div>

      <div class="form-field">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          aria-describedby="login-password-error"
        />
        <app-field-error
          [control]="form.controls.password"
          label="Password"
          id="login-password-error"
        />
      </div>

      <label class="checkbox">
        <input type="checkbox" formControlName="rememberMe" />
        <span>Keep me signed in</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span> Signing in…
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="auth-switch">New here? <a routerLink="/register">Create an account</a></p>
  </div>
</section>
